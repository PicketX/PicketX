name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - run: test -z "$(gofmt -l cmd internal pkg scripts)"
      - name: Reproduce pinned Agent protobuf bindings
        run: |
          curl -fsSL --retry 3 https://github.com/protocolbuffers/protobuf/releases/download/v31.1/protoc-31.1-linux-x86_64.zip -o "$RUNNER_TEMP/protoc.zip"
          echo "96553041f1a91ea0efee963cb16f462f5985b4d65365f3907414c360044d8065  $RUNNER_TEMP/protoc.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/protoc.zip" -d "$RUNNER_TEMP/protoc"
          export GOBIN="$RUNNER_TEMP/protoc/bin"
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.6.1
          export PATH="$GOBIN:$PATH"
          scripts/generate-agent-protocol.sh
          git diff --exit-code -- pkg/protocol/agent/v1alpha1
      - run: go vet ./...
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Reproduce and validate management OpenAPI 3.1 contract
        run: |
          export GOBIN="$RUNNER_TEMP/management-tools"
          go install github.com/swaggo/swag/v2/cmd/swag@v2.0.0-rc6
          export PATH="$GOBIN:$PATH"
          scripts/generate-management-api.sh
          git diff --exit-code -- docs/api
          npm ci --ignore-scripts --prefix tools/openapi
          npm run validate --prefix tools/openapi
      - run: go test -count=1 ./...
      - run: go test -count=1 -race -v ./...
      - name: Repeat actual Unix authorization startup under race detector
        run: go test -race -count=100 -run '^TestAuthorizationRuntimeTCPUnixAndShutdown$/unix$' ./internal/controllerapp
      - name: Repeat actual new-credential admission under race detector
        run: go test -race -count=100 -run '^TestNewCredentialReceivesPrepublishedNonemptyInventory$' ./internal/controllerapp
      - run: go build ./...
      - name: Static SQLite Controller artifact
        run: scripts/check-static-controller.sh
      - name: Static Linux CLI and absolute-deadline examples
        run: scripts/check-static-cli.sh

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Real Chromium console against Controller and SQLite
        env:
          PICKETX_BROWSER_EVIDENCE_DIR: ${{ runner.temp }}/console-evidence
        run: |
          sudo apt-get update
          sudo apt-get install -y nginx
          nginx -V
          npx playwright install --with-deps chromium
          npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: console-browser-screenshots
          path: ${{ runner.temp }}/console-evidence/*.png
          if-no-files-found: ignore

  install:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/installed-playwright
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Reject existing bundle targets before building
        run: node --test scripts/controller-bundle.test.mjs scripts/controller-state-copy.test.mjs
      - name: Build and inspect standalone Linux-amd64 Controller bundle
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          musl-gcc --version
          bash scripts/build-controller-bundle.sh "$RUNNER_TEMP/controller-bundle"
      - name: Retained distribution notices and dependency licenses
        env:
          PICKETX_TEST_BUNDLE: ${{ runner.temp }}/controller-bundle
        run: node --test scripts/controller-bundle-notices.test.mjs
      - name: Archive and re-extract executable installation payload
        run: |
          tar -C "$RUNNER_TEMP/controller-bundle" -czf "$RUNNER_TEMP/controller-linux-amd64.tar.gz" .
          cd "$RUNNER_TEMP"
          sha256sum controller-linux-amd64.tar.gz > controller-linux-amd64.tar.gz.sha256
          mkdir extracted-controller-bundle
          tar -C extracted-controller-bundle -xzf controller-linux-amd64.tar.gz
      - name: Actual detached install and browser restart acceptance
        env:
          PICKETX_INSTALL_EVIDENCE_DIR: ${{ runner.temp }}/install-evidence
        run: |
          cd apps/web
          npx playwright install --with-deps chromium
          cd ../..
          node apps/web/e2e/install.mjs "$RUNNER_TEMP/extracted-controller-bundle"
      - name: Actual unprivileged systemd and stopped complete-state restore
        run: |
          sudo --non-interactive env PICKETX_SERVICE_TESTS=1 \
            PLAYWRIGHT_BROWSERS_PATH="$PLAYWRIGHT_BROWSERS_PATH" \
            PICKETX_INSTALL_EVIDENCE_DIR="$RUNNER_TEMP/service-evidence" \
            "$(command -v node)" apps/web/e2e/install.mjs "$RUNNER_TEMP/extracted-controller-bundle" --systemd
      - uses: actions/upload-artifact@v4
        with:
          name: controller-linux-amd64
          path: |
            ${{ runner.temp }}/controller-linux-amd64.tar.gz
            ${{ runner.temp }}/controller-linux-amd64.tar.gz.sha256
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: controller-install-evidence
          path: ${{ runner.temp }}/install-evidence/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: controller-service-evidence
          path: ${{ runner.temp }}/service-evidence/
          if-no-files-found: error
