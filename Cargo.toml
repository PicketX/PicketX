[workspace]
members = [
    "apps/agent/picketxd",
    "apps/cli",
    "apps/controller",
    "crates/agent-state",
    "crates/api",
    "crates/authz",
    "crates/compiler",
    "crates/domain",
    "crates/netfilter",
    "crates/plugin-sdk",
    "crates/protocol",
    "crates/selector",
    "crates/storage",
    "crates/wasm-runtime",
]
resolver = "3"

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.95"

[workspace.lints.rust]
missing_docs = "warn"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
